<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love 💖</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-trail-container"></div>

    <div class="envelope-wrapper">
        <div class="envelope">
            <div class="envelope-flap"></div>
            <div class="envelope-paper">
                <div class="letter-text">
                    <h1>To My One & Only 💗</h1>
                    <div class="greeting"></div>
                    <button class="cta-button">Click to Enter Our World 💕</button>
                </div>
            </div>
            <div class="envelope-pocket"></div>
            <div class="envelope-heart-seal">❤️</div>
        </div>
        <div class="envelope-hint">Open My Heart 💌</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
